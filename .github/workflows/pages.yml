name: Deploy main + dev preview

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout stable main
        uses: actions/checkout@v6
        with:
          ref: main
          path: main-site

      - name: Checkout development branch
        uses: actions/checkout@v6
        with:
          ref: dev
          path: dev-site

      - name: Build combined website
        run: |
          mkdir -p public
          
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            main-site/ public/

          mkdir -p public/dev

          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            dev-site/ public/dev/

          touch public/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages website
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
